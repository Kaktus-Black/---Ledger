<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>___-Ledger</title>
<meta name="description" content="Offline personal finance tracker: transactions, budgets, debts, goals and reports." />
<meta name="theme-color" content="#17211B" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="___-Ledger" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div id="install-banner" class="install-banner">
  <span id="install-banner-text">Install ___-Ledger on this device for one-tap, offline access.</span>
  <span style="display:flex;gap:8px">
    <button data-action="install-app">Install</button>
    <button data-action="dismiss-install-banner" style="background:transparent;color:#17211B;text-decoration:underline">Not now</button>
  </span>
</div>

<div id="lock-screen" class="lock-screen" style="display:none">
  <div class="lock-card">
    <div class="lock-mark" id="lock-mark-text">L</div>
    <div class="lock-title" id="lock-title-text">___-Ledger is locked</div>
    <p class="muted lock-sub">Enter your PIN to continue</p>
    <input id="lock-pin-input" class="lock-input" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="••••" autocomplete="off" />
    <div id="lock-error" class="lock-error"></div>
    <button id="lock-unlock-btn" class="btn btn-primary lock-btn">Unlock</button>
    <button id="lock-forgot-btn" class="btn btn-ghost lock-btn">Forgot PIN?</button>
  </div>
</div>

<div id="app-shell" style="display:none">
  <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open menu">☰</button>

  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark" id="brand-mark-text">L</span>
        <div>
          <div class="brand-title" id="brand-title-text">___-Ledger</div>
          <div class="brand-sub txt-mono">personal finance</div>
        </div>
      </div>
      <button id="mobile-close-btn" class="mobile-close-btn" aria-label="Close menu">✕</button>
    </div>
    <nav id="nav-list" class="nav-list"></nav>
    <div class="side-foot txt-mono">stored on this device</div>
  </aside>

  <div id="scrim" class="scrim"></div>

  <main id="main" class="main"></main>

  <button id="fab-add" class="fab" data-action="goto" data-hash="add" aria-label="Add transaction">+</button>
</div>


<script src="./app.js"></script>
</body>
</html>
